<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evening Peak: With and Without Budhigandaki</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8f9fa;
    color: #2d3436;
    padding: 2rem;
    min-height: 100vh;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    padding: 2rem;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    font-size: 0.875rem;
    color: #636e72;
    margin-bottom: 1.5rem;
  }
  .big-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 1rem 0;
    font-size: 1rem;
    font-weight: 600;
    color: #006266;
    gap: 0.5rem;
  }
  .big-arrow svg {
    width: 40px;
    height: 24px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.25rem;
    margin-top: 1.25rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
  }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>The Evening Peak: With and Without Budhigandaki</h1>
  <p class="subtitle">6:30 pm winter dispatch — two scenarios from the Phase 2 model</p>
  
  <!-- LEFT: No Budhigandaki -->
  <svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="340" fill="#ffffff"/>
    
    <!-- LEFT BAR: No Budhigandaki -->
    <text x="80" y="40" font-size="13" font-weight="600" fill="#2d3436">Full portfolio — no Budhigandaki</text>
    <text x="80" y="56" font-size="10" fill="#636e72">Residual gap: 933 MW (23% of peak demand)</text>
    
    <!-- Demand outline -->
    <rect x="80" y="70" width="500" height="45" rx="4" fill="none" stroke="#2d3436" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="580" y="82" font-size="10" fill="#2d3436" font-weight="600">Demand 4,066 MW</text>
    
    <!-- Supply segments -->
    <rect x="80" y="70" width="185" height="45" rx="4" fill="#0984e3"/> <!-- RoR 1,504 -->
    <text x="172" y="97" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">RoR 1,504</text>
    
    <rect x="265" y="70" width="90" height="45" fill="#00b894"/> <!-- Reservoir 729 -->
    <text x="310" y="97" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Res. 729</text>
    
    <rect x="355" y="70" width="62" height="45" fill="#6c5ce7"/> <!-- BESS 500 -->
    <text x="386" y="97" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">BESS 500</text>
    
    <rect x="417" y="70" width="49" height="45" fill="#00cec9"/> <!-- Shaping 400 -->
    <text x="441" y="97" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Shape 400</text>
    
    <!-- Gap -->
    <rect x="466" y="70" width="114" height="45" rx="0 4 4 0" fill="#d63031" opacity="0.2"/>
    <rect x="466" y="70" width="114" height="45" rx="0 4 4 0" fill="none" stroke="#d63031" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="523" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#d63031">Gap 933</text>
    
    <!-- RIGHT BAR: With Budhigandaki -->
    <text x="80" y="170" font-size="13" font-weight="600" fill="#2d3436">With Budhigandaki</text>
    <text x="80" y="186" font-size="10" fill="#636e72">Residual: −147 MW (small surplus)</text>
    
    <!-- Demand outline -->
    <rect x="80" y="200" width="500" height="45" rx="4" fill="none" stroke="#2d3436" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="580" y="212" font-size="10" fill="#2d3436" font-weight="600">Demand 4,066 MW</text>
    
    <!-- Supply segments -->
    <rect x="80" y="200" width="185" height="45" rx="4" fill="#0984e3"/> <!-- RoR 1,504 -->
    <text x="172" y="227" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">RoR 1,504</text>
    
    <rect x="265" y="200" width="90" height="45" fill="#00b894"/> <!-- Reservoir 729 -->
    <text x="310" y="227" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Res. 729</text>
    
    <rect x="355" y="200" width="62" height="45" fill="#6c5ce7"/> <!-- BESS 500 -->
    <text x="386" y="227" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">BESS 500</text>
    
    <rect x="417" y="200" width="49" height="45" fill="#00cec9"/> <!-- Shaping 400 -->
    <text x="441" y="227" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Shape 400</text>
    
    <rect x="466" y="200" width="133" height="45" fill="#006266"/> <!-- Budhigandaki 1,080 -->
    <text x="532" y="227" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Budhi 1,080</text>
    
    <!-- Surplus -->
    <rect x="599" y="200" width="17" height="45" rx="0 4 4 0" fill="#00b894" opacity="0.5"/>
    <rect x="599" y="200" width="17" height="45" rx="0 4 4 0" fill="none" stroke="#00b894" stroke-width="2"/>
    <text x="607" y="227" text-anchor="middle" font-size="8" font-weight="700" fill="#00b894">+147</text>
    
    <!-- Big arrow between bars -->
    <path d="M 340 128 L 340 185" stroke="#006266" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/>
    <defs>
      <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#006266"/>
      </marker>
    </defs>
    <text x="350" y="160" font-size="11" font-weight="600" fill="#006266">Budhigandaki</text>
    <text x="350" y="174" font-size="10" fill="#006266">adds 1,080 MW</text>
    
    <!-- Bottom insight -->
    <text x="80" y="285" font-size="11" font-weight="600" fill="#2d3436">The Budhigandaki distinction:</text>
    <text x="80" y="302" font-size="10" fill="#636e72">Without it, the four-lever portfolio still leaves a 933 MW evening shortage.</text>
    <text x="80" y="318" font-size="10" fill="#636e72">With it, shortage becomes surplus. Budhigandaki is not an energy asset for 2035 — it is a firm-capacity asset.</text>
  </svg>
  
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#0984e3"></div>RoR hydro</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#00b894"></div>Reservoir (Tanahu + Dudhkoshi)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#6c5ce7"></div>BESS</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#00cec9"></div>Demand-shaping</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#006266"></div>Budhigandaki</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#d63031; opacity:0.2; border:1px dashed #d63031"></div>Gap (shortage)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#00b894; opacity:0.5"></div>Surplus</div>
  </div>
</div>
</body>
</html>
